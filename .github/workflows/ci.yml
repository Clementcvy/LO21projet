name: CI

# Run the workflow on every push and pull request.
on: [push, pull_request]

jobs:
  test:
    # GitHub creates a fresh Linux machine for this job.
    runs-on: ubuntu-latest

    steps:
      # Download the repository files into the CI machine.
      # Without this step, the following commands would run in an empty directory.
      - name: Check out repository
        uses: actions/checkout@v4

      # Compile the console application with the root Makefile.
      - name: Build console application
        run: make

      # Build and run the automated tests declared in the Makefile.
      - name: Run automated tests
        run: make test
